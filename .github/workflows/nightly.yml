# Manual only: bring in new Substack posts as draft editions, then rebuild the site.
# The nightly schedule was removed (2026-11-05): Supabase's dhd-daily-refresh cron already rebuilds
# the site every night, and editions are now published on the site first.
# To run it, use "Run workflow" in GitHub Actions (needs Actions enabled on the account).
# Repository secrets needed: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DEPLOY_HOOK_URL.
name: Import Substack posts and rebuild

on:
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import new Substack posts as drafts
        run: node scripts/import-substack.mjs --create-drafts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Rebuild the site
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
