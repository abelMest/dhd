<!doctype html>
<!--
  Digital Health Digest illustrated edition cover, 1456×816.
  One object in the middle, four labelled callouts around it, the logo bottom-right.
  scripts/make-edition-covers.mjs calls window.renderCover({ icon, labels: [a, b, c, d] }) for each edition.
  Open this file directly to preview: template.html?icon=medkit&labels=One|Two|Three|Four
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Spartan'; src: url('../../node_modules/@fontsource-variable/league-spartan/files/league-spartan-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
* { margin: 0; }
html, body { width: 1456px; height: 816px; overflow: hidden; background: #071a29; }
svg { display: block; font-family: 'Spartan', sans-serif; }
</style></head>
<body>
<svg id="c" width="1456" height="816" viewBox="0 0 1456 816"></svg>
<script src="icons.js"></script>
<script>
const { C, ICONS } = window;

// Callout spots: label anchor, line end near the halo, and which way the text runs.
const SPOTS = [
  { x: 150, y: 170, ex: 560, ey: 300, align: 'start' },
  { x: 1306, y: 170, ex: 896, ey: 300, align: 'end' },
  { x: 150, y: 600, ex: 560, ey: 520, align: 'start' },
  { x: 1306, y: 560, ex: 896, ey: 520, align: 'end' },
];

function wrap(text, max = 20) {
  const words = String(text).toUpperCase().split(/\s+/); const lines = [''];
  for (const w of words) { const cur = lines.at(-1); if ((cur + ' ' + w).trim().length > max && cur) lines.push(w); else lines[lines.length - 1] = (cur + ' ' + w).trim(); }
  return lines.slice(0, 2);
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

window.renderCover = ({ icon = 'medkit', labels = [] }) => {
  const draw = ICONS[icon] || ICONS.medkit;
  const callouts = SPOTS.map((s, i) => {
    const t = labels[i]; if (!t) return '';
    const lines = wrap(t); const dir = s.align === 'start' ? 1 : -1;
    const ringX = s.x + dir * 34;
    return `<g>
      <path d="M${ringX + dir * 40} ${s.y + 40} L${(ringX + s.ex) / 2} ${s.y + 40} L${s.ex} ${s.ey}" fill="none" stroke="${C.b3}" stroke-width="2" opacity=".55"/>
      <circle cx="${s.ex}" cy="${s.ey}" r="5" fill="${C.b2}"/>
      <ellipse cx="${ringX}" cy="${s.y + 40}" rx="38" ry="38" fill="${C.n3}" stroke="${C.b3}" stroke-width="2" opacity=".95"/>
      <text x="${ringX}" y="${s.y + 50}" text-anchor="middle" font-weight="800" font-size="26" fill="${i === 0 ? C.a : C.b2}">${String(i + 1).padStart(2, '0')}</text>
      ${lines.map((l, j) => `<text x="${s.x + (s.align === 'start' ? 0 : 0)}" y="${s.y + 118 + j * 32}" text-anchor="${s.align}" font-weight="700" font-size="25" letter-spacing="2.5" fill="${C.w2}">${esc(l)}</text>`).join('')}
    </g>`;
  }).join('');
  document.getElementById('c').innerHTML = `
    <defs>
      <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${C.b3}" stop-opacity=".28"/><stop offset="1" stop-color="${C.b3}" stop-opacity="0"/></radialGradient>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
    </defs>
    <rect width="1456" height="816" fill="${C.navy}"/>
    <path d="M0 250 L520 0 H1456 V180 L620 816 H0 Z" fill="${C.n2}"/>
    <path d="M300 816 L1456 120 V816 Z" fill="${C.n3}" opacity=".8"/>
    <path d="M0 520 L360 816 H0 Z" fill="${C.n3}" opacity=".6"/>
    <circle cx="728" cy="410" r="300" fill="url(#halo)"/>
    <circle cx="728" cy="410" r="235" fill="none" stroke="${C.b3}" stroke-width="2" opacity=".35"/>
    <circle cx="728" cy="410" r="270" fill="none" stroke="${C.b3}" stroke-width="1.5" stroke-dasharray="4 10" opacity=".35"/>
    <ellipse cx="728" cy="610" rx="190" ry="26" fill="#000" opacity=".28"/>
    ${callouts}
    <g transform="translate(728 410)" filter="url(#sh)">${draw()}</g>
    <g transform="translate(1066 744)">
      <rect width="38" height="38" rx="8" fill="#15202b"/>
      <path d="M4 22 h7 l3.5 -11 l6 20 l5 -15.5 l2.4 6 h6" fill="none" stroke="#6cb4e4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="26" font-weight="800" font-size="17" letter-spacing="2.6" fill="${C.w2}">DIGITAL HEALTH DIGEST</text>
    </g>`;
};

const q = new URLSearchParams(location.search);
window.renderCover({ icon: q.get('icon') || 'layers', labels: (q.get('labels') || 'Direct|Build|Run|Measure').split('|') });
window.ICON_NAMES = Object.keys(ICONS);
</script>
</body></html>
